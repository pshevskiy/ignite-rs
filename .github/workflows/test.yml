name: Test

on:
  pull_request:

jobs:
  pure:
    name: Pure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v2

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Run pure bucket
        env:
          CARGO_TERM_COLOR: always
        run: cargo run --manifest-path ignite-rs/Cargo.toml -p xtask -- test-matrix --bucket pure

  single-node:
    name: Single Node
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v2

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Run single-node bucket
        env:
          CARGO_TERM_COLOR: always
          IGNITE_TEST_TAG: 2.15.0
          IGNITE_TEST_START_RETRIES: 60
          IGNITE_TEST_START_DELAY_MS: 1000
        run: cargo run --manifest-path ignite-rs/Cargo.toml -p xtask -- test-matrix --bucket single_node

