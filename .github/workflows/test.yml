name: Test

on:
  pull_request:

jobs:
  pure:
    name: Pure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run pure bucket
        env:
          CARGO_TERM_COLOR: always
        run: cargo run --manifest-path Cargo.toml -p xtask -- test-matrix --bucket pure

  single-node:
    name: Single Node
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run single-node bucket
        env:
          CARGO_TERM_COLOR: always
          IGNITE_TEST_TAG: 2.15.0
          IGNITE_TEST_START_RETRIES: 60
          IGNITE_TEST_START_DELAY_MS: 1000
        run: cargo run --manifest-path Cargo.toml -p xtask -- test-matrix --bucket single_node

